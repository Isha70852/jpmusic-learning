<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日文歌學習機</title>
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        :root {
            --bg-main: #1e1e2e;
            --bg-panel: #313244;
            --bg-input: #45475a;
            --text-main: #cdd6f4;
            --text-sub: #a6adc8;
            --accent: #cba6f7;
            --accent-hover: #b4befe;
            --lyric-active: #a6e3a1;
            --furi-color: #f38ba8;
        }
        
        body {
            font-family: 'Segoe UI', Meiryo, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            height: 100vh;
            box-sizing: border-box;
            display: flex;
            gap: 20px;
            overflow: hidden;
        }

        .sidebar {
            width: 350px;
            background: var(--bg-panel);
            padding: 20px;
            border-radius: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex-shrink: 0;
        }
        .sidebar h2 { margin-top: 0; color: var(--accent); font-size: 1.4em; }
        
        .panel {
            background: #181825;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #89b4fa;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .panel.ai-panel { border-left-color: var(--accent); }

        input[type="text"], input[type="password"], select, input[type="file"] {
            padding: 10px;
            border: 1px solid #585b70;
            background: var(--bg-input);
            color: var(--text-main);
            border-radius: 5px;
            width: 100%;
            box-sizing: border-box;
        }
        button {
            padding: 10px;
            background-color: #89b4fa;
            color: #11111b;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            width: 100%;
        }
        button:hover { background-color: #74c7ec; }
        .ai-btn { background-color: var(--accent); }
        .ai-btn:hover { background-color: var(--accent-hover); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        /* ✨ 新增：取得模型按鈕用較小樣式 */
        .fetch-model-btn {
            background-color: #a6e3a1;
            font-size: 0.85em;
            padding: 7px;
        }
        .fetch-model-btn:hover { background-color: #94d994; }

        .toggle-group {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-sub);
            font-weight: bold;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: var(--bg-panel);
            border-radius: 12px;
            padding: 20px;
            overflow: hidden;
        }

        .video-section {
            height: 75%;
            background: #11111b;
            border-radius: 8px;
            overflow: hidden;
        }
        iframe, video { width: 100%; height: 100%; border: none; }

        .lyrics-section {
            height: 25%;
            background: #11111b;
            border-radius: 8px;
            overflow-y: auto;
            padding: 100px 20px 200px 20px;
            scroll-behavior: smooth;
            position: relative;
        }

        .lyric-line {
            text-align: center;
            margin-bottom: 35px;
            opacity: 0.4;
            transition: all 0.3s ease;
            transform: scale(0.95);
        }
        .lyric-line.active {
            opacity: 1;
            transform: scale(1.1);
        }
        .lyric-jp {
            font-size: 1.6em;
            font-weight: bold;
            color: var(--text-main);
            margin-bottom: 8px;
        }
        .lyric-zh {
            font-size: 1.1em;
            color: var(--text-sub);
        }

        ruby { ruby-align: center; }
        rt {
            font-size: 0.5em;
            color: var(--furi-color);
            font-weight: normal;
            transform: translateY(-2px);
        }
        .hide-furigana rt { display: none; }
        .hide-translation .lyric-zh { display: none; }

        .saved-item {
        background: #1e1e2e;
        border-radius: 6px;
        padding: 8px 10px;
        display: flex;
        flex-direction: column;
        gap: 5px;
        font-size: 0.82em;
        border-left: 3px solid #89b4fa;
        }
        .saved-item .saved-title {
            color: var(--text-main);
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .saved-item .saved-meta {
            color: var(--text-sub);
            font-size: 0.9em;
        }
        .saved-item .saved-actions {
            display: flex;
            gap: 6px;
        }
        .saved-item .saved-actions button {
            flex: 1;
            padding: 5px;
            font-size: 0.85em;
        }
        .btn-load  { background-color: #89b4fa; }
        .btn-dl    { background-color: #a6e3a1; color: #11111b; }
        .btn-del   { background-color: #f38ba8; color: #11111b; }
        .btn-load:hover { background-color: #74c7ec; }
        .btn-dl:hover   { background-color: #7ec87e; }
        .btn-del:hover  { background-color: #e06c75; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>🎵 設定</h2>
        
        <div class="panel">
            <label>1. 載入媒體</label>
            <input type="text" id="ytUrl" placeholder="貼上 YouTube 網址">
            <button onclick="loadYouTube()">讀取 YT 影片</button>
            <hr style="border: 0.5px solid #585b70; width: 100%;">
            <input type="file" id="localVideoFile" accept="video/*" onchange="loadLocalVideo()">
            <div id="mediaStatus" style="color: #f9e2af; font-size: 0.85em; margin-top: 5px;">尚未載入</div>
        </div>

        <div class="panel">
            <label>2. 抓取原版時間軸</label>
            <input type="text" id="trackName" placeholder="歌曲名稱">
            <input type="text" id="artistName" placeholder="歌手名稱">
            <button onclick="searchLyrics()">搜尋歌詞</button>
            <select id="lyricsVersion" style="display: none;" onchange="loadSelectedOriginalLyrics()"></select>
            <div id="searchStatus" style="color: var(--text-sub); font-size: 0.85em;"></div>
        </div>

        <div class="panel ai-panel">
            <label>3. 歌詞生成與載入</label>

            <!-- ✨ 修改區塊開始：動態模型選擇 -->
            <div style="display: flex; gap: 8px; align-items: stretch;">
                <input type="password" id="geminiApiKey" placeholder="貼上 Gemini API Key" style="flex: 1; width: auto;">
                <button class="fetch-model-btn" style="width: auto; white-space: nowrap;" onclick="fetchModelList()" id="fetchModelBtn" title="輸入 API Key 後點此取得模型清單">🔄 取得模型</button>
            </div>

            <div id="modelSelectWrapper">
                <!-- 預設顯示常用模型（未取得清單前的 fallback） -->
                <select id="aiModel">
                    <option value="" disabled>— 請先點擊「取得模型」—</option>
                    <option value="gemini-2.5-flash" selected>gemini-2.5-flash（預設）</option>
                    <option value="gemini-2.5-pro">gemini-2.5-pro</option>
                    <option value="gemini-3-flash-preview">gemini-3-flash-preview</option>
                    <option value="gemini-3.1-pro-preview">gemini-3.1-pro-preview</option>
                </select>
                <div id="modelStatus" style="color: var(--text-sub); font-size: 0.8em; margin-top: 4px;"></div>
            </div>
            <!-- ✨ 修改區塊結束 -->

            <button id="translateBtn" class="ai-btn" onclick="translateWithAI()">產生假名與翻譯</button>
            
            <label style="margin-top: 10px; font-size: 0.9em; color: var(--text-sub);">📥 手動載入翻譯檔 (.txt / .lrc)</label>
            <input type="file" id="localLyricsFile" accept=".txt,.lrc" onchange="loadLocalLyricsFile()">
            
            <div id="aiStatus" style="color: var(--text-sub); font-size: 0.85em;"></div>
        </div>

        <div class="panel">
            <label>4. 顯示設定</label>
            <div class="toggle-group">
                <input type="checkbox" id="furiToggle" checked onchange="toggleFurigana()">
                <label for="furiToggle">顯示漢字上方假名</label>
            </div>
            <div class="toggle-group">
                <input type="checkbox" id="transToggle" checked onchange="toggleTranslation()">
                <label for="transToggle">顯示中文翻譯</label>
            </div>
        </div>

        <!-- 5. 下載當前歌詞 -->
        <div class="panel">
            <label>5. 下載當前歌詞</label>
            <button onclick="downloadCurrentLyrics()" style="background-color:#a6e3a1; color:#11111b;">
                ⬇️ 下載為 .txt（LRC 格式）
            </button>
            <div id="downloadStatus" style="color: var(--text-sub); font-size: 0.85em;"></div>
        </div>

        <!-- 6. 已儲存的歌詞紀錄 -->
        <div class="panel">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <label>6. 已儲存歌詞紀錄</label>
                <button onclick="refreshSavedList()" 
                        style="width:auto; padding:4px 10px; font-size:0.8em; background:#585b70; color:var(--text-main);">
                    🔄 重整
                </button>
            </div>
            <div id="savedLyricsList" style="display:flex; flex-direction:column; gap:8px; max-height:300px; overflow-y:auto;">
                <!-- 由 JS 動態填入 -->
            </div>
            <div id="savedListStatus" style="color: var(--text-sub); font-size: 0.82em;"></div>
        </div>
            </div>

    <div class="main-content">
        <div class="video-section" id="mediaContainer">
            <div style="color: #585b70; display: flex; align-items: center; justify-content: center; height: 100%;">等待媒體載入...</div>
        </div>
        
        <div class="lyrics-section" id="lyricsContainer">
            <div style="color: #585b70; text-align: center; margin-top: 10%;">請先載入影片並翻譯歌詞</div>
        </div>
    </div>

    <script>
        let currentLyrics = [];
        let ytPlayer = null;
        let localVideoElement = null;
        let syncInterval = null;
        let activeIndex = -1;
        let currentMediaId = null;

        // ✨ 新增：動態取得 Gemini 模型清單
        async function fetchModelList() {
            const apiKey = document.getElementById('geminiApiKey').value.trim();
            const modelStatusEl = document.getElementById('modelStatus');
            const fetchBtn = document.getElementById('fetchModelBtn');

            if (!apiKey) {
                alert("請先輸入 Gemini API Key！");
                return;
            }

            modelStatusEl.innerText = "⏳ 取得模型清單中...";
            fetchBtn.disabled = true;

            try {
                const res = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}&pageSize=100`
                );
                const data = await res.json();

                if (data.error) throw new Error(data.error.message);

                // 篩選支援 generateContent 的模型（排除 embedding、TTS、Veo 等）
                const generativeModels = (data.models || []).filter(m =>
                    m.supportedGenerationMethods &&
                    m.supportedGenerationMethods.includes("generateContent")
                );

                if (generativeModels.length === 0) {
                    throw new Error("此 API Key 沒有可用的 generateContent 模型");
                }

                // 重建 select 選項
                const selectEl = document.getElementById('aiModel');
                selectEl.innerHTML = "";

                // 優先排序：flash 系列在前，pro 在後
                generativeModels.sort((a, b) => {
                    const nameA = a.name.toLowerCase();
                    const nameB = b.name.toLowerCase();
                    // 實驗性/preview 的排到最後
                    const isExpA = nameA.includes("exp") || nameA.includes("latest");
                    const isExpB = nameB.includes("exp") || nameB.includes("latest");
                    if (isExpA !== isExpB) return isExpA ? 1 : -1;
                    return nameA.localeCompare(nameB);
                });

                let defaultSet = false;
                generativeModels.forEach(m => {
                    // m.name 格式為 "models/gemini-xxx"，取後半段作為 API 呼叫用的 model id
                    const modelId = m.name.replace("models/", "");
                    const displayLabel = m.displayName || modelId;
                    const opt = new Option(`${displayLabel} (${modelId})`, modelId);
                    
                    // 預設選取 gemini-2.5-flash 或清單第一個
                    if (!defaultSet && modelId.includes("2.5-flash") && !modelId.includes("lite") && !modelId.includes("live") && !modelId.includes("tts")) {
                        opt.selected = true;
                        defaultSet = true;
                    }
                    selectEl.add(opt);
                });

                // 若沒找到預設，選第一個
                if (!defaultSet && selectEl.options.length > 0) {
                    selectEl.options[0].selected = true;
                }

                modelStatusEl.style.color = "#a6e3a1";
                modelStatusEl.innerText = `✅ 已載入 ${generativeModels.length} 個可用模型`;

            } catch (e) {
                modelStatusEl.style.color = "#f38ba8";
                modelStatusEl.innerText = "❌ 失敗：" + e.message;
            } finally {
                fetchBtn.disabled = false;
            }
        }

        // --- 抓取 YT 標題 ---
        async function fetchYouTubeTitle(url) {
            try {
                const res = await fetch(`https://noembed.com/embed?url=${encodeURIComponent(url)}`);
                const data = await res.json();
                if (data.title) {
                    document.getElementById('mediaStatus').innerText = "已載入：" + data.title;
                    document.getElementById('trackName').value = data.title;
                }
            } catch (e) { console.log("無法抓取標題", e); }
        }

        // --- 1. 媒體載入 ---
        function loadYouTube() {
            const url = document.getElementById('ytUrl').value;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            currentMediaId = (match && match[2].length === 11) ? match[2] : null;

            if (!currentMediaId) return alert("無效的 YouTube 連結！");

            document.getElementById('mediaStatus').innerText = `載入中... (ID: ${currentMediaId})`;
            fetchYouTubeTitle(url);
            
            const container = document.getElementById('mediaContainer');
            container.innerHTML = '<div id="ytPlayerDiv"></div>';
            ytPlayer = new YT.Player('ytPlayerDiv', { videoId: currentMediaId });
            
            if(syncInterval) clearInterval(syncInterval);
            syncInterval = setInterval(() => {
                if (ytPlayer && ytPlayer.getPlayerState && ytPlayer.getPlayerState() === 1) {
                    updateLyricsHighlight(ytPlayer.getCurrentTime());
                }
            }, 100);

            checkLocalDatabase();
        }

        function loadLocalVideo() {
            const file = document.getElementById('localVideoFile').files[0];
            if (!file) return;
            
            currentMediaId = file.name;
            const fileUrl = URL.createObjectURL(file);
            document.getElementById('mediaContainer').innerHTML = `<video id="localVideoPlayer" controls src="${fileUrl}"></video>`;
            localVideoElement = document.getElementById('localVideoPlayer');
            document.getElementById('mediaStatus').innerText = "已載入本地影片：" + file.name;
            
            if(syncInterval) clearInterval(syncInterval);
            localVideoElement.addEventListener('timeupdate', () => {
                updateLyricsHighlight(localVideoElement.currentTime);
            });

            checkLocalDatabase();
        }

        function checkLocalDatabase() {
            if (!currentMediaId) return;
            const savedData = localStorage.getItem('lyrics_' + currentMediaId);
            if (savedData) {
                if (confirm('💾 系統偵測到這部影片之前已經生成過歌詞與翻譯，是否直接載入？\n(按確定直接載入，按取消重新抓取)')) {
                    currentLyrics = JSON.parse(savedData);
                    renderLyrics();
                    document.getElementById('aiStatus').innerText = "✅ 已從本地資料庫載入歌詞。";
                }
            }
        }

        // --- 2. 歌詞搜尋 ---
        let searchResults = [];
        async function searchLyrics() {
            const track = document.getElementById('trackName').value;
            const artist = document.getElementById('artistName').value;
            const statusText = document.getElementById('searchStatus');
            
            if (!track) return alert("請輸入歌曲名稱！");
            statusText.innerText = "搜尋中...";
            
            try {
                const res = await fetch(`https://lrclib.net/api/search?track_name=${encodeURIComponent(track)}&artist_name=${encodeURIComponent(artist)}`);
                const data = await res.json();
                searchResults = data.filter(item => item.syncedLyrics);
                
                const selectEl = document.getElementById('lyricsVersion');
                if (searchResults.length > 0) {
                    statusText.innerText = `找到 ${searchResults.length} 個版本，已準備就緒。`;
                    selectEl.innerHTML = "";
                    searchResults.forEach((item, index) => {
                        const mins = Math.floor(item.duration / 60);
                        const secs = Math.floor(item.duration % 60).toString().padStart(2, '0');
                        selectEl.add(new Option(`[${mins}:${secs}] 專輯: ${item.albumName || '未知'}`, index));
                    });
                    selectEl.style.display = "block";
                } else {
                    statusText.innerText = "找不到時間軸歌詞。";
                    selectEl.style.display = "none";
                }
            } catch (e) { statusText.innerText = "連線失敗。"; }
        }

        // --- 3. AI 翻譯 ---
        async function translateWithAI() {
            const apiKey = document.getElementById('geminiApiKey').value.trim();
            // ✨ 直接讀取動態 select 的當前值
            const model = document.getElementById('aiModel').value;
            const trackName = document.getElementById('trackName').value;
            const aiStatusText = document.getElementById('aiStatus');
            const btn = document.getElementById('translateBtn');

            if (!apiKey) return alert("請輸入 API Key！");
            if (!model) return alert("請先點擊「取得模型」並選擇模型！");
            if (searchResults.length === 0) return alert("請先搜尋原版歌詞！");
            if (!currentMediaId) return alert("請先載入 YouTube 或本地影片，以便儲存歌詞！");

            const index = document.getElementById('lyricsVersion').value;
            const selectedLRC = searchResults[index].syncedLyrics;

            aiStatusText.innerText = `🧠 使用 ${model} 標註假名並翻譯中，請稍候...`;
            btn.disabled = true;

            const prompt = `
你是一位專業的日文翻譯與歌詞排版專家。請處理以下 LRC 格式的日文歌詞。
歌曲名稱：${trackName}

【嚴格輸出格式要求】：
1. 必須保留時間標籤：每行開頭必須是原始的 [mm:ss.xx]。
2. 標註平假名：請將日文歌詞中的「所有漢字」加上 HTML 的 <ruby> 與 <rt> 標籤來標註平假名。例如：<ruby>断罪<rt>だんざい</rt></ruby>の<ruby>花<rt>はな</rt></ruby>。
3. 加上中文翻譯：在標註完假名的日文後面加上「 / 」，然後接上根據原曲語境翻譯的繁體中文。
4. 輸出範例：[00:15.34] <ruby>断罪<rt>だんざい</rt></ruby>の<ruby>花<rt>はな</rt></ruby> / 斷罪之花
5. 純音樂無歌詞的行數，請照抄時間標籤即可。
6. 請直接輸出轉換後的純文字 LRC，絕對不要使用 Markdown 代碼區塊 (不要加 \`\`\`)。

原始歌詞：
${selectedLRC}
`;

            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error.message);

                let resultText = data.candidates[0].content.parts[0].text;
                resultText = resultText.replace(/```lrc/g, "").replace(/```/g, "").trim();
                
                parseAILyrics(resultText);
                localStorage.setItem('lyrics_' + currentMediaId, JSON.stringify(currentLyrics));
                renderLyrics();
                aiStatusText.innerText = `✅ 使用 ${model} 處理完成並已自動儲存！`;
            } catch (error) {
                aiStatusText.innerText = "❌ 失敗: " + error.message;
            } finally {
                btn.disabled = false;
            }
        }

        function parseAILyrics(lrcString) {
            currentLyrics = [];
            const lines = lrcString.split('\n');
            const timeRegex = /\[(\d{2}):(\d{2}(?:\.\d+)?)\](.*)/;
            
            for (let line of lines) {
                const match = line.match(timeRegex);
                if (match) {
                    const time = (parseInt(match[1]) * 60) + parseFloat(match[2]);
                    const content = match[3].trim();
                    
                    let jpText = content;
                    let zhText = "";
                    
                    const splitIdx = content.lastIndexOf(' / ');
                    if (splitIdx !== -1) {
                        jpText = content.substring(0, splitIdx).trim();
                        zhText = content.substring(splitIdx + 3).trim();
                    } else if (content.includes('/')) {
                        const parts = content.split('/');
                        zhText = parts.pop().trim();
                        jpText = parts.join('/').trim();
                    }

                    currentLyrics.push({ time: time, jp: jpText, zh: zhText });
                }
            }
        }

        function loadLocalLyricsFile() {
            const file = document.getElementById('localLyricsFile').files[0];
            if (!file) return;

            const aiStatusText = document.getElementById('aiStatus');
            aiStatusText.innerText = "📄 讀取檔案中...";

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                parseAILyrics(text);
                if (currentMediaId) {
                    localStorage.setItem('lyrics_' + currentMediaId, JSON.stringify(currentLyrics));
                }
                renderLyrics();
                aiStatusText.innerText = "✅ 成功讀取手動上傳的歌詞檔！";
            };
            reader.onerror = function() {
                aiStatusText.innerText = "❌ 讀取檔案失敗！";
            };
            reader.readAsText(file);
        }

        // --- 4. 畫面渲染與連動 ---
        function renderLyrics() {
            const container = document.getElementById('lyricsContainer');
            container.innerHTML = ""; 
            
            currentLyrics.forEach((lyric, idx) => {
                const div = document.createElement('div');
                div.className = 'lyric-line';
                div.id = 'lyric-' + idx;
                div.innerHTML = `
                    <div class="lyric-jp">${lyric.jp}</div>
                    <div class="lyric-zh">${lyric.zh}</div>
                `;
                container.appendChild(div);
            });
            
            activeIndex = -1; 
            toggleFurigana();
            toggleTranslation();
        }

        function toggleFurigana() {
            const container = document.getElementById('lyricsContainer');
            if (document.getElementById('furiToggle').checked) {
                container.classList.remove('hide-furigana');
            } else {
                container.classList.add('hide-furigana');
            }
        }

        function toggleTranslation() {
            const container = document.getElementById('lyricsContainer');
            if (document.getElementById('transToggle').checked) {
                container.classList.remove('hide-translation');
            } else {
                container.classList.add('hide-translation');
            }
        }

        function updateLyricsHighlight(currentTime) {
            if (currentLyrics.length === 0) return;

            let newActiveIndex = -1;
            for (let i = 0; i < currentLyrics.length; i++) {
                if (currentTime >= currentLyrics[i].time) newActiveIndex = i;
                else break;
            }

            if (newActiveIndex !== activeIndex && newActiveIndex !== -1) {
                if (activeIndex !== -1) {
                    const oldEl = document.getElementById('lyric-' + activeIndex);
                    if (oldEl) oldEl.classList.remove('active');
                }
                const newEl = document.getElementById('lyric-' + newActiveIndex);
                if (newEl) {
                    newEl.classList.add('active');
                    const container = document.getElementById('lyricsContainer');
                    container.scrollTop = newEl.offsetTop - (container.clientHeight / 2) + (newEl.clientHeight / 2);
                }
                activeIndex = newActiveIndex;
            }
        }

        // ======== 5. 下載當前歌詞 ========

        /**
        * 將 currentLyrics 陣列重組為 LRC 格式字串
        * 格式：[mm:ss.xx] <ruby>...</ruby> / 中文翻譯
        */
        function lyricsToLRC(lyrics) {
            return lyrics.map(item => {
                const totalSec = item.time;
                const mm = String(Math.floor(totalSec / 60)).padStart(2, '0');
                const ss = (totalSec % 60).toFixed(2).padStart(5, '0');
                const content = item.zh ? `${item.jp} / ${item.zh}` : item.jp;
                return `[${mm}:${ss}] ${content}`;
            }).join('\n');
        }

        function downloadCurrentLyrics() {
            const statusEl = document.getElementById('downloadStatus');
            if (currentLyrics.length === 0) {
                statusEl.style.color = '#f38ba8';
                statusEl.innerText = '❌ 尚無歌詞可下載，請先翻譯或載入歌詞。';
                return;
            }

            const lrcText = lyricsToLRC(currentLyrics);
            // 用媒體 ID 或預設名稱當檔名
            const filename = (currentMediaId ? currentMediaId : 'lyrics') + '.txt';
            triggerDownload(lrcText, filename);

            statusEl.style.color = '#a6e3a1';
            statusEl.innerText = `✅ 已下載：${filename}（共 ${currentLyrics.length} 行）`;
        }

        /** 共用觸發下載函式 */
        function triggerDownload(text, filename) {
            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }


        // ======== 6. LocalStorage 歌詞管理 ========

        /** 掃描 localStorage，找出所有 lyrics_ 開頭的 Key */
        function getSavedLyricsKeys() {
            const keys = [];
            for (let i = 0; i < localStorage.length; i++) {
                const k = localStorage.key(i);
                if (k && k.startsWith('lyrics_')) keys.push(k);
            }
            return keys;
        }

        /** 重整已儲存清單（頁面載入及儲存後自動呼叫） */
        function refreshSavedList() {
            const listEl = document.getElementById('savedLyricsList');
            const statusEl = document.getElementById('savedListStatus');
            const keys = getSavedLyricsKeys();

            listEl.innerHTML = '';

            if (keys.length === 0) {
                statusEl.innerText = '目前無任何已儲存的歌詞。';
                return;
            }

            statusEl.innerText = `共 ${keys.length} 筆已儲存。`;

            keys.forEach(key => {
                let lyrics = [];
                try { lyrics = JSON.parse(localStorage.getItem(key)); } catch(e) { return; }

                const mediaId = key.replace('lyrics_', '');
                // 嘗試取第一行有中文的歌詞作為預覽
                const preview = lyrics.find(l => l.zh)?.zh || lyrics[0]?.jp || '（無預覽）';

                const item = document.createElement('div');
                item.className = 'saved-item';
                item.innerHTML = `
                    <div class="saved-title" title="${mediaId}">🎵 ${mediaId}</div>
                    <div class="saved-meta">共 ${lyrics.length} 行 ・ 預覽：${preview}</div>
                    <div class="saved-actions">
                        <button class="btn-load" onclick="loadSavedLyrics('${key}')">📂 載入</button>
                        <button class="btn-dl"   onclick="downloadSavedLyrics('${key}')">⬇️ 下載</button>
                        <button class="btn-del"  onclick="deleteSavedLyrics('${key}', this)">🗑️ 刪除</button>
                    </div>
                `;
                listEl.appendChild(item);
            });
        }

        /** 載入指定 key 的歌詞到播放器 */
        function loadSavedLyrics(key) {
            const data = localStorage.getItem(key);
            if (!data) return alert('找不到此筆資料！');
            currentLyrics = JSON.parse(data);
            renderLyrics();
            currentMediaId = key.replace('lyrics_', '');
            document.getElementById('aiStatus').innerText = `✅ 已從紀錄載入：${currentMediaId}`;
            // 滾動到顯示設定區，讓使用者看到歌詞已更新
            document.getElementById('lyricsContainer').scrollTop = 0;
        }

        /** 下載指定 key 的歌詞為 txt */
        function downloadSavedLyrics(key) {
            const data = localStorage.getItem(key);
            if (!data) return alert('找不到此筆資料！');
            const lyrics = JSON.parse(data);
            const lrcText = lyricsToLRC(lyrics);
            const filename = key.replace('lyrics_', '') + '.txt';
            triggerDownload(lrcText, filename);
        }

        /** 刪除指定 key 並移除 DOM 元素 */
        function deleteSavedLyrics(key, btn) {
            if (!confirm(`確定要刪除「${key.replace('lyrics_', '')}」的歌詞紀錄嗎？`)) return;
            localStorage.removeItem(key);
            // 移除該 DOM 項目
            btn.closest('.saved-item').remove();
            // 更新計數
            const remaining = getSavedLyricsKeys().length;
            document.getElementById('savedListStatus').innerText =
                remaining > 0 ? `共 ${remaining} 筆已儲存。` : '目前無任何已儲存的歌詞。';
        }

        // 頁面載入時自動掃描一次
        window.addEventListener('DOMContentLoaded', refreshSavedList);
    </script>
</body>
</html>
